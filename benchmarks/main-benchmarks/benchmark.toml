[runner]
benchmark_root = "main-benchmarks"
dpus = [64, 128, 256, 512, 1024, 2048]
warmup = 5
iterations = 20
ntrials = 5
seed = 1
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[setup]
variants = ["polymerpim", "julia"]
commands = [
  "make -C \"{repo}\" install DESTDIR=\"{install}\" PIPELINE=1 JIT=1 LOGGING=3 TRACE=0 JULIA=\"{julia}\" {fusion_flags}",
]

[[elementwise]]
elements_per_dpu = [2097152, 3145728]
operation = "-abs(((a) + (b)) - (a))"
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[elementwise-interpreter]]
elements_per_dpu = [2097152, 3145728]
variants = ["baseline"]

[[hist]]
elements_per_dpu = [1048576, 2097152]
parameters = { depth = 12, bins = 256 }
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[kmeans]]
elements_per_dpu = [262144, 524288]
iterations = 20
parameters = { dim = 10, k = 10 }
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[knn]]
elements_per_dpu = [262144, 524288]
iterations = 20
parameters = { dim = 10, k = 1 }
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[linreg]]
elements_per_dpu = [524288, 1048576]
parameters = { dim = 10, scaling_shift = 12, learning_shift = 24, learning_rate = 1 }
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[multitask_classifier]]
elements_per_dpu = [262144, 524288]
iterations = 10
parameters = { features = 8, classes = 4 }
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[red]]
elements_per_dpu = [1048576, 2097152]
variants = ["polymerpim", "julia", "baseline", "simplepim"]

[[vector_search]]
elements_per_dpu = [262144, 524288]
warmup = 10
iterations = 50
parameters = { dim = 10 }
variants = ["polymerpim", "julia", "baseline", "simplepim"]
