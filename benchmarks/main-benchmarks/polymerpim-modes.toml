[runner]
benchmark_root = "main-benchmarks"
dpus = [64, 128, 256, 512, 1024, 2048]
warmup = 5
iterations = 20
ntrials = 5
seed = 1
variants = ["polymerpim-jit", "polymerpim-pipeline", "polymerpim-eager"]
group_by_variant = true

[[elementwise]]
elements_per_dpu = [2097152]
operation = "-abs(((a) + (b)) - (a))"

[[knn]]
elements_per_dpu = [262144]
iterations = 20
parameters = { dim = 10, k = 1 }

[[linreg]]
elements_per_dpu = [524288]
parameters = { dim = 10, scaling_shift = 12, learning_shift = 24, learning_rate = 1 }
