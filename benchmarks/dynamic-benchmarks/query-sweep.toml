[runner]
benchmark_root = "dynamic-benchmarks"
dpus = [64]
warmup = 0
iterations = 10
ntrials = 1
seed = 1
variants = [
  "polymerpim-jit",
  "polymerpim-hybrid",
  "polymerpim-pipeline",
  "simplepim",
]
group_by_variant = true

[[dynamic_query]]
elements_per_dpu = [1024, 4096, 16384, 65536, 262144]
parameters = { columns = 4, projections = 1, batches_per_query = 5, query_ops = 2 }
