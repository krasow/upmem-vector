[runner]
dpus = [64, 128, 256, 512, 1024, 2048]
warmup = 0
iterations = 20
ntrials = 5
seed = 1
variants = [
  "polymerpim-jit",
  "polymerpim-hybrid",
  "polymerpim-pipeline",
  "polymerpim-eager",
]
group_by_variant = true

[[adaptive_image]]
elements_per_dpu = [262144, 524288]
parameters = { channels = 4, check_interval = 2, tolerance = 2 }
