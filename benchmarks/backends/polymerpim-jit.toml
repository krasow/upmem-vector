name = "polymerpim-jit"
directory = "{benchmark_root}/polymerpim/{benchmark}"
parameter_file = "Param.h"
setup = [
  "make -C \"{repo}\" install DESTDIR=\"{install}\" PIPELINE=1 JIT=1 LOGGING=3 TRACE=0 JULIA=__skip_julia_wrapper__ {fusion_flags}",
]
build = ["make clean", "make"]
run = "./run"
timing_label = "polymerpim"
# Modes are compared at one fixed configuration: a JIT-tuned profile
# would cap can_interpret() and silently make the interpreter run eagerly.
use_profile = false
